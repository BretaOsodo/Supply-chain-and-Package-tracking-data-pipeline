global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: 
            - 'localhost:9090'
    - job_name: 'spark-master'
      metrics_path: '/metrics/master/prometheus'
      static_configs:
        - targets: 
            - 'spark-master:8080' 

    - job_name: 'spark-worker1'
      metrics_path: '/metrics/worker/prometheus'
      static_configs:
        - targets: 
            - 'spark-worker1:8081'
    - job_name: 'spark-worker2'
      metrics_path: '/metrics/worker/prometheus'
      static_configs:
        - targets: 
            - 'spark-worker2:8081'

    - job_name: 'alertmanager'
      static_configs:
        - targets: 
            - 'alertmanager:9093'

    - job_name: 'kafak-exporter'
      static_configs:
        - targets: 
            - 'kafka-exporter:9308'

    - job_name: 'cadvisor'
      static_configs:
        - targets: 
            - 'cadvisor:8080'
