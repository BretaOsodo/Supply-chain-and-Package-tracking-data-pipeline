name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened,synchronize,reopened]
permissions:
  contents: read
  pull-requests: write
  id-token: write
jobs:
  docker:
    name: Validate Docker Configurations
    runs-on: ubuntu-latest

    steps:
      - name: checkpoint repository
        uses: actions/checkout@v4
      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          PGADMIN_EMAIL=admin@example.com
          PGADMIN_PASSWORD=ci-password
          PGADMIN_PORT=5050
          POSTGRES_SCHEMA=public
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          HOST_PORT=8080
          AWS_ACCESS_KEY=dummy
          AWS_SECRET_KEY=dummy
          AWS_REGION=us-east-1
          EOF

      - name: Validate Docker compose
        run: |
          docker compose config
      - name: Build Spark image
        run: |
          docker compose build spark-master
      - name: Build the network
        run: |
          docker network create supply_chain
      - name: Build docker images
        run: |
          docker compose up -d

      - name: Show running containers
        run: |
          docker compose ps 

      - name : Show Docker logs on failure
        if: failure()
        run: |
          docker compose ps

  test:
    name: Test python Code
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkpoint repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest test/ -v -x

  validate-and-plan-terraform:
    name: validate & Plan
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stetup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: "1.9.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      #static checks
      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      #Init against the dev state Key
      - name: Init
        run: terraform -chdir=terraform init -input=false -backend-config="key=dev/terraform.tfstate"

      - name: Validate
        run: terraform -chdir=terraform validate

      #plan
      - name: plan
        id: plan
        env:
          TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
          TF_VAR_key_name: ${{ secrets.EC2_KEY_NAME }}
        run: |
          terraform -chdir=terraform plan -input=false -out=plan.tfplan -no-color | tee plan.txt
        
          

      #post the plan on the PR
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const body = `### Terraform Plan (dev)\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
