volumes:
    psotgres-db-volume:
    pgadmin-data:
    kafka-data:
    grafana-data:

networks:
    supply_chain:
        external: true

services:
    kafka1:
        image: confluentinc/cp-kafka:7.7.0
        container_name: kafka1
        hostname: kafka1
        ports:
            - "127.0.0.1:9092:9092"
        healthcheck:
            test: [ "CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1" ]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s
        environment:
            CLUSTER_ID: bgVKLUurTM6-Wx0gyGaPxQ
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: "broker,controller"
            KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,EXTERNAL://127.0.0.1:9092"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093
            KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 3
            KAFKA_MIN_INSYNC_REPLICAS: 2

        networks:
            - supply_chain

    kafka2:
        image: confluentinc/cp-kafka:7.7.0
        container_name: kafka2
        hostname: kafka2
        ports:
            - "127.0.0.1:9093:9093"
        healthcheck:
            test: [ "CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1" ]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s
        environment:
            CLUSTER_ID: bgVKLUurTM6-Wx0gyGaPxQ
            KAFKA_NODE_ID: 2
            KAFKA_PROCESS_ROLES: "broker,controller"
            KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,EXTERNAL://127.0.0.1:9092"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093"
            KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 3
            KAFKA_MIN_INSYNC_REPLICAS: 2

        networks:
            - supply_chain

    schema-registry:
        image: confluentinc/cp-schema-registry:latest
        container_name: schema-registry
        ports:
            - "127.0.0.1:8082:8082"

        depends_on:
            kafka1:
                condition: service_healthy
            kafka2:
                condition: service_healthy
        
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka1:29092,INTERNAL://kafka2:29092'
            SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8082'
        networks:
        - supply_chain