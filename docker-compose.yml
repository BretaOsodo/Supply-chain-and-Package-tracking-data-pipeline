volumes:
    postgres-db-volume:
    pgadmin-data:
    kafka-data:
    grafana-data:

networks:
    supply_chain:
        external: true

services:
    kafka1:
        image: confluentinc/cp-kafka:7.7.0
        container_name: kafka1
        hostname: kafka1
        ports:
            - "127.0.0.1:9092:9092"
        healthcheck:
            test: [ "CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1" ]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s
        environment:
            CLUSTER_ID: bgVKLUurTM6-Wx0gyGaPxQ
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: "broker,controller"
            KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,EXTERNAL://127.0.0.1:9092"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093"
            KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 3
            KAFKA_MIN_INSYNC_REPLICAS: 2

        networks:
            - supply_chain

    kafka2:
        image: confluentinc/cp-kafka:7.7.0
        container_name: kafka2
        hostname: kafka2
        ports:
            - "127.0.0.1:9093:9093"
        healthcheck:
            test: [ "CMD-SHELL", "kafka-topics --bootstrap-server 127.0.0.1:9092 --list > /dev/null 2>&1" ]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s
        environment:
            CLUSTER_ID: bgVKLUurTM6-Wx0gyGaPxQ
            KAFKA_NODE_ID: 2
            KAFKA_PROCESS_ROLES: "broker,controller"
            KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,EXTERNAL://127.0.0.1:9092"
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
            KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093"
            KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
            KAFKA_DEFAULT_REPLICATION_FACTOR: 3
            KAFKA_MIN_INSYNC_REPLICAS: 2

        networks:
            - supply_chain

    schema-registry:
        image: confluentinc/cp-schema-registry:latest
        container_name: schema-registry
        ports:
            - "127.0.0.1:8082:8082"

        depends_on:
            kafka1:
                condition: service_healthy
            kafka2:
                condition: service_healthy
        
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka1:29092,INTERNAL://kafka2:29092'
            SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8082'
        networks:
        - supply_chain

    #kafdrop for UI 
    kafdrop:
        image: obsidiandynamics/kafdrop:latest
        container_name: kafdrop
        ports:
            - "127.0.0.1:9000:9000"

        environment:
            KAFKA_BROKERCONNECT: "kafka1:29092,kafka2:29092"
            JVM_OPTS: "-Xms32M -Xmx128M"

        depends_on:
            - kafka1
            - kafka2

        networks:
            - supply_chain

    #Spark master services 
    spark-master:
        build:
            context: ./spark
            dockerfile: Dockerfile

        container_name: spark-master
        hostname: spark-master
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master

        ports:
            - "127.0.0.1:9090:8080"
            - "127.0.0.1:7077:7077"

        volumes:
            - ./spark:/spark
        networks:
            - supply_chain

        restart: unless-stopped

    spark-worker1:
        build:
            context: ./spark
            dockerfile: Dockerfile

        container_name: spark-worker1
        hostname: spark-worker1
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077

        ports:
            - "127.0.0.1:9090:8080"
        volumes:
            - ./spark:/spark

        depends_on:
            - spark-master

        environment:
            - SPARK_WORKER_MEMORY=1g
            - SPARK_WORKER_CORES= 2
            - SPARK_MODE= worker
            - SPARK_MASTER=spark://spark-master:7077
        networks:
            - supply_chain      

        restart: unless-stopped


    spark-worker2:
        build:
            context: ./spark
            dockerfile: Dockerfile

        container_name: spark-worker2
        hostname: spark-worker2
        command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077

        ports:
            - "127.0.0.1:9091:8080"

        depends_on:
            - spark-master

        environment:
            - SPARK_WORKER_MEMORY= 1g
            - SPARK_WORKER_CORES= 2
            - SPARK_MODE= worker
            - SPARK_MASTER=spark://spark-master:7077

        volumes:
            - ./spark:/spark    
        networks:
            - supply_chain
        restart: unless-stopped

    #prometheus service for monitoring
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        ports:
            - "127.0.0.1:9096:9090"

        volumes:
            - ./monitoring/prometheus:/etc/prometheus

        depends_on:
            - spark-master
            - spark-worker1
            - spark-worker2
        networks:
            - supply_chain

    #grafana service for monitoring
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "127.0.0.1:3000:3000"

        volumes:
            - grafana-data:/var/lib/grafana
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

        networks:
            - supply_chain

    #alertmanager service for monitoring
    alertmanager:
        image: prom/alertmanager:latest
        container_name: alertmanager
        ports:
            - "127.0.0.1:9093:9093"
        networks:
            - supply_chain

    kafka-exporters:
        image: danielqsj/kafka-exporter:latest
        container_name: kafka-exporters
        ports:
            - "127.0.0.1:9308:9308"
        
        command:
            - '--kafka.server=kafka1:29092,kafka2:29092'
            - '--web.listen-address=:9308'
            - '--log.level=info'
        
        depends_on:
            - kafka1
            - kafka2
        networks:
            - supply_chain
    # cadvisor service for monitoring docker containers 
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.49.1
        container_name: cadvisor
        ports:
            - "8080:8080"
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        privileged: true
        devices:
            - /dev/kmsg
